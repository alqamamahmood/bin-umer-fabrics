# Bin Umer Fabrics — Cloud build (GitHub Actions).
#
# Kyun: is VM par Gradle daemon ko loopback TCP chahiye aur sandbox Java TCP
# block karta hai, is liye local `flutter build apk` nahi chalti. Ye workflow
# APK GitHub ke runner par banata hai aur seedha release v1.0.0 par upload
# karta hai (GITHUB_TOKEN apne repo mein release likh sakta hai).
#
# Trigger: sirf manual (workflow_dispatch) — push se duplicate run na ho.
# v1 = FRONTEND ONLY: koi Firebase/backend nahi, koi keystore nahi
# (debug-signed APK, preview ke liye). Orders sirf device par save hote hain.
#
# Output: release v1.0.0, asset BinUmerFabrics.apk

name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.9 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install Android NDK 28.2.13676358 (agar pehle se na ho)
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          if [ -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "NDK 28.2.13676358 already installed"
          else
            echo "Installing NDK 28.2.13676358..."
            yes | "$SDKMANAGER" "ndk;28.2.13676358"
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      # -v (verbose): Gradle ka har task log mein chhapta hai — build
      # khamosh nahi rehti.
      - name: Build release APK (ARM64 only)
        run: flutter build apk --release --target-platform android-arm64 -v

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -i "assets/products" \
            && echo "fabric swatches APK ke andar maujood hain" \
            || echo "::warning::assets/products APK mein nahi mile"

      - name: Upload APK to release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk BinUmerFabrics.apk
          gh release create v1.0.0 --title "Bin Umer Fabrics v1.0.0 (frontend preview)" --notes "Frontend-only preview — offline catalog, cart aur in-app order. Koi backend/Firebase nahi." || true
          gh release upload v1.0.0 BinUmerFabrics.apk --clobber
          echo "APK uploaded to release v1.0.0."
